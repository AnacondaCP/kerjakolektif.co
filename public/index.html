<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>KerjaKolektif</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <section id="login" class="login">
      <div class="box">
        <div class="logo">KERJAKOLEKTIF</div>
        <h1>Masuk</h1>
        <div class="mut">Pipeline &amp; finance agency</div>
        <label for="u">Username</label
        ><input
          id="u"
          autocomplete="username"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        />
        <label for="p">Password</label
        ><input id="p" type="password" autocomplete="current-password" />
        <div class="err" id="lerr"></div>
        <button class="btn p w" id="lbtn">Login</button>
      </div>
    </section>

    <section id="app" class="app hide">
      <header class="bar2">
        <button class="btn s" id="mb" aria-label="Buka menu">☰ Menu</button
        ><b>KERJAKOLEKTIF</b><span style="flex: 1"></span
        ><button class="btn s" id="sb">Cari</button
        ><button class="btn s" id="nb">Notifikasi</button>
      </header>
      <div id="scrim"></div>
      <nav class="side" id="nav">
        <div class="logo">KERJAKOLEKTIF</div>
        <a class="nav-home" data-v="dash">Dashboard</a>
        <div class="sp"></div>
        <a id="th">Mode Gelap/Terang</a>
        <a id="out">Logout</a>
      </nav>
      <main class="main" id="main"></main>
    </section>
    <div id="mod"></div>

    <script src="/js/app.js"></script>
  </body>
</html>
